[package]
name = "koala-netty"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Bytes handling
bytes = "1.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Event streaming
tokio-stream = "0.1"

# For broadcast channels
futures = "0.3"